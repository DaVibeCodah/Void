# Vo!d Edge Configuration
# Full rate limit and protection policy config

scoring:
  block_threshold:        100
  captcha_threshold:       80
  pow_threshold:           60
  js_challenge_threshold:  40
  invisible_threshold:     20

rate_limits:
  global:
    rps: 100000
    burst: 150000
    algorithm: token_bucket

  per_ip:
    rps: 100
    burst: 200
    window_seconds: 60
    action: challenge

  per_session:
    rps: 30
    burst: 60
    window_seconds: 10
    action: slow_down

  endpoints:
    "/api/auth/login":
      rps: 5
      burst: 10
      window_seconds: 60
      action: block

    "/api/auth/register":
      rps: 3
      burst: 5
      window_seconds: 60
      action: captcha

    "/api/search":
      rps: 20
      burst: 40
      window_seconds: 10
      action: challenge

    "/api/checkout":
      rps: 10
      burst: 20
      window_seconds: 60
      action: captcha

    "/api/password-reset":
      rps: 2
      burst: 3
      window_seconds: 300
      action: captcha

  burst_detection:
    window_seconds: 1
    spike_multiplier: 5.0  # 5x above EWMA baseline = burst
    action: pow_challenge

honeypots:
  paths:
    - "/.env"
    - "/.env.local"
    - "/.env.production"
    - "/.git/config"
    - "/.git/HEAD"
    - "/wp-login.php"
    - "/wp-admin/"
    - "/admin/config.php"
    - "/phpinfo.php"
    - "/server-status"
    - "/server-info"
    - "/.aws/credentials"
    - "/config.yml"
    - "/config.json"
    - "/backup.zip"
    - "/backup.sql"
    - "/database.sql"
    - "/api/v0/users"
    - "/api/internal/debug"
    - "/.DS_Store"
    - "/robots_secret.txt"

  score_penalty: 50
  track_session: true
  html_trap: true  # inject hidden link in HTML responses

canary:
  enabled: true
  paths:
    - "/canary/trap-a3f7b2"
    - "/canary/trap-c9d1e8"
  score_penalty: 60
  html_comment_trap: true

normalization:
  max_encoding_depth: 5
  max_path_depth: 32
  block_on_crlf: true
  block_on_null_byte: true
  max_path_length: 2048
  max_header_size: 16384
  max_body_size: 10485760  # 10MB

ip_intelligence:
  block_bogons: true
  block_tor: false          # challenge instead
  tor_challenge: pow
  datacenter_penalty: 20
  tor_penalty: 35
  vpn_penalty: 10
  bad_reputation_threshold: 0.5

tls:
  min_version: "1.2"
  ja3_known_bot_action: challenge
  ja4_mismatch_action: challenge
  cipher_mismatch_penalty: 18

http2:
  pseudo_header_mismatch_penalty: 18
  settings_mismatch_penalty: 15

challenge:
  pow:
    min_difficulty: 4     # bits (score=60)
    max_difficulty: 20    # bits (score=100)
    algorithm: sha256
    validity_seconds: 300

  wasm:
    enabled: true
    min_score: 65

  session_cookie:
    name: "__void_pass"
    same_site: "Lax"
    http_only: true
    max_age: 3600

logging:
  level: info
  format: json
  include_signals: true
  include_score_breakdown: false  # enable for debugging

metrics:
  prometheus_path: "/__void/metrics"
  enabled: true
