global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "void-edge"
    static_configs:
      - targets: ["localhost:8080"]
    metrics_path: "/__void/metrics"

  - job_name: "void-behavior"
    static_configs:
      - targets: ["behavior-engine:8000"]
    metrics_path: "/metrics"

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
